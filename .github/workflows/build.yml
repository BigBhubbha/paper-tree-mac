name: Build Paper Tree.app

on:
  push:
    branches: [main, stable-signing]
  workflow_dispatch:
    inputs:
      local_ai_demo:
        description: "Run the on-device reader demo (models are downloaded on the runner; never runs on main)"
        type: boolean
        default: false
      full_writer:
        description: "Also try one explanation with the full 9B writer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the exact Sparkle version pinned in Package.swift.
  SPARKLE_VERSION: "2.10.1"
  # SHA-1 of the long-lived self-signed "Paper Tree Signing" certificate (public, not a secret).
  # The app's designated requirement pins this, so macOS keeps Accessibility across updates.
  # Never change this certificate, or every user has to re-approve Accessibility once more.
  SIGN_CERT_SHA1: "9CD58C283100C34F864773EED1B2B9D96A7FC3BD"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Work out version and build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then PUBLISH=false; else PUBLISH=true; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "Version $VERSION, build $BUILD_NUMBER, tag $TAG, publish $PUBLISH"

      - name: Import the signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [[ -z "$MACOS_SIGN_P12" || -z "$MACOS_SIGN_P12_PASSWORD" ]]; then echo "MACOS_SIGN_P12 / MACOS_SIGN_P12_PASSWORD secrets are missing" >&2; exit 1; fi
          KEYCHAIN="$RUNNER_TEMP/papertree-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/sign.p12"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGN_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Add it to the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-certificate -a -Z "$KEYCHAIN" | grep -i "SHA-1 hash: $SIGN_CERT_SHA1" \
            || { echo "The imported certificate is not the expected Paper Tree Signing certificate" >&2; exit 1; }
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_CERT_SHA1" >> "$GITHUB_ENV"

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Check the stable designated requirement
        run: |
          APP="build/Paper Tree.app"
          EXPECTED='identifier "com.papertree.mac" and certificate leaf = H"'"$(echo "$SIGN_CERT_SHA1" | tr 'A-F' 'a-f')"'"'
          codesign -dr - "$APP" 2>&1 | tee "$RUNNER_TEMP/dr.txt"
          grep -qi "designated => $EXPECTED" "$RUNNER_TEMP/dr.txt" \
            || { echo "Designated requirement is not the stable one: expected designated => $EXPECTED" >&2; exit 1; }
          # The app must satisfy exactly the requirement macOS stored when Accessibility was granted.
          codesign --verify --strict -R "=$EXPECTED" "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier|Signature"
          echo "Stable designated requirement OK"

      - name: Check the app
        run: |
          APP="build/Paper Tree.app"
          lipo -info "$APP/Contents/MacOS/PaperTree"
          lipo -info "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          otool -L "$APP/Contents/MacOS/PaperTree" | grep -iE "sparkle|llama|sherpa"
          lipo -info "$APP/Contents/Frameworks/libsherpa-onnx-c-api.dylib" "$APP/Contents/Frameworks/libonnxruntime.dylib"
          ls "$APP/Contents/Resources/LocalAI"
          otool -l "$APP/Contents/MacOS/PaperTree" | grep -A2 LC_RPATH
          plutil -lint "$APP/Contents/Info.plist"
          for k in CFBundleShortVersionString CFBundleVersion SUFeedURL SUPublicEDKey SUEnableAutomaticChecks; do
            echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Contents/Info.plist")"
          done
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -20
          # The binary must load with Sparkle from inside the bundle.
          "$APP/Contents/MacOS/PaperTree" --paper-tree-load-check >/dev/null 2>&1 &
          PID=$!; sleep 4
          if kill -0 $PID 2>/dev/null; then echo "App launched and stayed up for 4 s"; kill $PID; else wait $PID; echo "App exited early with status $?"; exit 1; fi

      - name: Render design snapshots
        continue-on-error: true
        run: |
          "build/Paper Tree.app/Contents/MacOS/PaperTree" --paper-tree-snapshots "$RUNNER_TEMP/snapshots"
          ls -la "$RUNNER_TEMP/snapshots"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: design-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn

      # The on-device reader: a real explanation, a real podcast written and voiced on this runner,
      # timings, the sample episode and its screens. Branches only, by hand.
      - name: Cache local reader models
        if: inputs.local_ai_demo && github.ref != 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: ~/paper-tree-models
          key: local-ai-models-v1-full-${{ inputs.full_writer }}

      - name: Download local reader models
        if: inputs.local_ai_demo && github.ref != 'refs/heads/main'
        run: |
          M="$HOME/paper-tree-models"; mkdir -p "$M/kokoro-v1.0"
          get() {
            if [[ -f "$2" && "$(shasum -a 256 "$2" | cut -d' ' -f1)" == "$3" ]]; then echo "have $(basename "$2")"; return; fi
            curl -fL --retry 3 --silent --show-error -o "$2" "$1"
            got="$(shasum -a 256 "$2" | cut -d' ' -f1)"
            [[ "$got" == "$3" ]] || { echo "bad checksum for $2: $got" >&2; exit 1; }
          }
          HF=https://huggingface.co
          K="$HF/csukuangfj/kokoro-multi-lang-v1_0/resolve/f7b96bb6bef5c5da4d3aa4f4e0498fbbf62dc78b"
          get "$HF/unsloth/Qwen3.5-2B-GGUF/resolve/f6d5376be1edb4d416d56da11e5397a961aca8ae/Qwen3.5-2B-Q4_K_M.gguf" "$M/Qwen3.5-2B-Q4_K_M.gguf" aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223
          get "$K/model.onnx" "$M/kokoro-v1.0/model.onnx" b40f62b166ac8164b0627ef48a0b358eda0985e272fb03ef5252e7206305da11
          get "$K/voices.bin" "$M/kokoro-v1.0/voices.bin" 1c5a5b983d3d50d8586d437a51f3faa2da7919ce76a013c081e65671a3447c29
          get "$K/tokens.txt" "$M/kokoro-v1.0/tokens.txt" 6ebb6bb288f20f3ae8d004d3c2ca27697da27c037d75e81a60e2a6a663f95425
          get "$K/lexicon-us-en.txt" "$M/kokoro-v1.0/lexicon-us-en.txt" 7daaab53a181be9885b853a8582bf1838186317e5dadacbcef9c426d6fa0da14
          if [[ "${{ inputs.full_writer }}" == "true" ]]; then
            get "$HF/lmstudio-community/Qwen3.5-9B-GGUF/resolve/1379f25c6b505a3fc737bd7818cb09389cf807c1/Qwen3.5-9B-Q4_K_M.gguf" "$M/Qwen3.5-9B-Q4_K_M.gguf" cd76ec205963b3b33350093e6904d9de16c4e666fd104e1f632d25c7f15f2a13
          fi
          ls -la "$M" "$M/kokoro-v1.0"
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize

      - name: Local reader demo (2B sibling, CPU)
        if: inputs.local_ai_demo && github.ref != 'refs/heads/main'
        timeout-minutes: 40
        env:
          PAPER_TREE_LLM_CPU: "1"
          PAPER_TREE_LLM_LOG: "1"
        run: |
          M="$HOME/paper-tree-models"
          PAPER_TREE_WRITER_MODEL="$M/Qwen3.5-2B-Q4_K_M.gguf" PAPER_TREE_VOICE_DIR="$M/kokoro-v1.0" \
            /usr/bin/time -l "build/Paper Tree.app/Contents/MacOS/PaperTree" --paper-tree-local-ai-demo "$RUNNER_TEMP/local-ai" --tag 2b-cpu
          ls -la "$RUNNER_TEMP/local-ai"

      - name: Local reader, one explanation on Metal (2B)
        if: inputs.local_ai_demo && github.ref != 'refs/heads/main' && !cancelled()
        continue-on-error: true
        timeout-minutes: 10
        env:
          PAPER_TREE_LLM_LOG: "1"
        run: |
          M="$HOME/paper-tree-models"
          PAPER_TREE_WRITER_MODEL="$M/Qwen3.5-2B-Q4_K_M.gguf" \
            "build/Paper Tree.app/Contents/MacOS/PaperTree" --paper-tree-local-ai-demo "$RUNNER_TEMP/local-ai" --explain-only --tag 2b-metal

      - name: Local reader, one explanation with the full 9B writer (CPU)
        if: inputs.local_ai_demo && inputs.full_writer && github.ref != 'refs/heads/main' && !cancelled()
        continue-on-error: true
        timeout-minutes: 25
        env:
          PAPER_TREE_LLM_CPU: "1"
        run: |
          M="$HOME/paper-tree-models"
          PAPER_TREE_WRITER_MODEL="$M/Qwen3.5-9B-Q4_K_M.gguf" \
            /usr/bin/time -l "build/Paper Tree.app/Contents/MacOS/PaperTree" --paper-tree-local-ai-demo "$RUNNER_TEMP/local-ai" --explain-only --tag 9b-cpu

      - uses: actions/upload-artifact@v4
        if: inputs.local_ai_demo && github.ref != 'refs/heads/main' && always()
        with:
          name: local-ai-demo
          path: ${{ runner.temp }}/local-ai
          if-no-files-found: warn

      - name: Make DMG and update archive
        run: |
          rm -rf dist && mkdir -p dist/stage
          ditto "build/Paper Tree.app" "dist/stage/Paper Tree.app"
          cat > "dist/stage/First time, read me.txt" <<'TXT'
          Paper Tree for Mac

          1. Drag Paper Tree into the Applications folder.
          2. Open Applications, right-click Paper Tree, choose Open, then Open again.
             (Only the first time. Paper Tree isn't signed by Apple yet.)
          3. System Settings > Privacy & Security > Accessibility: switch on Paper Tree.
          4. Tap the right Option key twice to turn on Research mode.
             (Tap it once to open your trees in the notch.)

          After this, updates install themselves from the flask's menu.
          TXT
          # The drawn window background (Resources/dmg, made by scripts/make_dmg_background.py),
          # with the 1x and 2x images joined so Retina screens get the sharp one.
          # Redraw it for this version so the label never goes stale (Pillow only if the runner lacks it).
          python3 -m pip install --quiet --user pillow 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || true
          python3 scripts/make_dmg_background.py "$VERSION" || echo "::warning::kept the committed DMG background"
          tiffutil -cathidpicheck Resources/dmg/background.png Resources/dmg/background@2x.png -out dist/background.tiff
          brew install create-dmg || true
          made=false
          if command -v create-dmg >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              rm -f dist/Paper_Tree.dmg
              if create-dmg \
                  --volname "Paper Tree" \
                  --background dist/background.tiff \
                  --window-pos 200 120 \
                  --window-size 640 400 \
                  --icon-size 112 \
                  --text-size 13 \
                  --icon "Paper Tree.app" 170 210 \
                  --hide-extension "Paper Tree.app" \
                  --app-drop-link 470 210 \
                  --icon "First time, read me.txt" 320 340 \
                  --filesystem HFS+ \
                  --format UDZO \
                  dist/Paper_Tree.dmg dist/stage; then
                made=true; break
              fi
              echo "create-dmg attempt $attempt failed, trying again"; sleep 5
            done
          fi
          if [[ "$made" != true ]]; then
            # Finder layout can fail on a headless runner. Ship a plain DMG rather than none.
            echo "::warning::create-dmg failed, so this DMG has no drawn background"
            ln -s /Applications dist/stage/Applications
            hdiutil create -volname "Paper Tree" -srcfolder dist/stage -ov -format UDZO -fs HFS+ dist/Paper_Tree.dmg
          fi
          hdiutil verify dist/Paper_Tree.dmg
          ditto -c -k --sequesterRsrc --keepParent "build/Paper Tree.app" "dist/Paper-Tree-$VERSION.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dmg-preview
          path: dist/Paper_Tree.dmg
          if-no-files-found: warn

      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then echo "SPARKLE_PRIVATE_KEY secret is missing" >&2; exit 1; fi
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          KEYFILE="$RUNNER_TEMP/ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          ZIP="dist/Paper-Tree-$VERSION.zip"
          SIG_LINE="$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$KEYFILE" "$ZIP")"
          rm -f "$KEYFILE"
          echo "$SIG_LINE"
          ED_SIG="$(echo "$SIG_LINE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(stat -f%z "$ZIP")"
          if [[ -z "$ED_SIG" ]]; then echo "sign_update gave no signature" >&2; exit 1; fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Paper-Tree-$VERSION.zip"
          NOTES="release-notes/$VERSION.md"
          [[ -f "$NOTES" ]] || { echo "Paper Tree $VERSION" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          python3 scripts/make_appcast.py dist/appcast.xml "$VERSION" "$BUILD_NUMBER" "$URL" "$LENGTH" "$ED_SIG" "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: Paper-Tree-${{ env.VERSION }}
          path: |
            dist/Paper_Tree.dmg
            dist/Paper-Tree-*.zip
            dist/appcast.xml
          if-no-files-found: error

      - name: Publish release
        # Releases only ever come from main, so test branches can build without shipping.
        if: env.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/$VERSION.md"
          [[ -f "$NOTES" ]] || { echo "Paper Tree for Mac $VERSION" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          gh release create "$TAG" dist/Paper_Tree.dmg "dist/Paper-Tree-$VERSION.zip" dist/appcast.xml \
            --title "Paper Tree $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA" --latest

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${SIGN_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi

      - name: Release already exists
        if: env.PUBLISH != 'true' || github.ref != 'refs/heads/main'
        run: echo "Release $TAG already exists, so this run only uploads the build as an artifact. Bump CFBundleShortVersionString to publish a new version."
