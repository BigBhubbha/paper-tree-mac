name: Build Paper Tree.app

on:
  push:
    branches: [main, stable-signing]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the exact Sparkle version pinned in Package.swift.
  SPARKLE_VERSION: "2.10.1"
  # SHA-1 of the long-lived self-signed "Paper Tree Signing" certificate (public, not a secret).
  # The app's designated requirement pins this, so macOS keeps Accessibility across updates.
  # Never change this certificate, or every user has to re-approve Accessibility once more.
  SIGN_CERT_SHA1: "9CD58C283100C34F864773EED1B2B9D96A7FC3BD"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Work out version and build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then PUBLISH=false; else PUBLISH=true; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "Version $VERSION, build $BUILD_NUMBER, tag $TAG, publish $PUBLISH"

      - name: Import the signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [[ -z "$MACOS_SIGN_P12" || -z "$MACOS_SIGN_P12_PASSWORD" ]]; then echo "MACOS_SIGN_P12 / MACOS_SIGN_P12_PASSWORD secrets are missing" >&2; exit 1; fi
          KEYCHAIN="$RUNNER_TEMP/papertree-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/sign.p12"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGN_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Add it to the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-certificate -a -Z "$KEYCHAIN" | grep -i "SHA-1 hash: $SIGN_CERT_SHA1" \
            || { echo "The imported certificate is not the expected Paper Tree Signing certificate" >&2; exit 1; }
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_CERT_SHA1" >> "$GITHUB_ENV"

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Check the stable designated requirement
        run: |
          APP="build/Paper Tree.app"
          EXPECTED='identifier "com.papertree.mac" and certificate leaf = H"'"$(echo "$SIGN_CERT_SHA1" | tr 'A-F' 'a-f')"'"'
          codesign -dr - "$APP" 2>&1 | tee "$RUNNER_TEMP/dr.txt"
          grep -qi "designated => $EXPECTED" "$RUNNER_TEMP/dr.txt" \
            || { echo "Designated requirement is not the stable one: expected designated => $EXPECTED" >&2; exit 1; }
          # The app must satisfy exactly the requirement macOS stored when Accessibility was granted.
          codesign --verify --strict -R "=$EXPECTED" "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier|Signature"
          echo "Stable designated requirement OK"

      - name: Check the app
        run: |
          APP="build/Paper Tree.app"
          lipo -info "$APP/Contents/MacOS/PaperTree"
          lipo -info "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          otool -L "$APP/Contents/MacOS/PaperTree" | grep -i sparkle
          otool -l "$APP/Contents/MacOS/PaperTree" | grep -A2 LC_RPATH
          plutil -lint "$APP/Contents/Info.plist"
          for k in CFBundleShortVersionString CFBundleVersion SUFeedURL SUPublicEDKey SUEnableAutomaticChecks; do
            echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Contents/Info.plist")"
          done
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -20
          # The binary must load with Sparkle from inside the bundle.
          "$APP/Contents/MacOS/PaperTree" --paper-tree-load-check >/dev/null 2>&1 &
          PID=$!; sleep 4
          if kill -0 $PID 2>/dev/null; then echo "App launched and stayed up for 4 s"; kill $PID; else wait $PID; echo "App exited early with status $?"; exit 1; fi

      - name: Make DMG and update archive
        run: |
          rm -rf dist && mkdir -p dist/stage
          ditto "build/Paper Tree.app" "dist/stage/Paper Tree.app"
          ln -s /Applications dist/stage/Applications
          cat > "dist/stage/First time - read me.txt" <<'TXT'
          Paper Tree for Mac

          1. Drag Paper Tree into the Applications folder.
          2. Open Applications, right-click Paper Tree, choose Open, then Open again.
             (Only the first time. Paper Tree isn't signed by Apple yet.)
          3. System Settings > Privacy & Security > Accessibility: switch on Paper Tree.
          4. Click the flask in your menu bar and turn on Research mode.

          After this, updates install themselves from the flask's menu.
          TXT
          hdiutil create -volname "Paper Tree" -srcfolder dist/stage -ov -format UDZO -fs HFS+ dist/Paper_Tree.dmg
          hdiutil verify dist/Paper_Tree.dmg
          ditto -c -k --sequesterRsrc --keepParent "build/Paper Tree.app" "dist/Paper-Tree-$VERSION.zip"
          ls -la dist

      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then echo "SPARKLE_PRIVATE_KEY secret is missing" >&2; exit 1; fi
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          KEYFILE="$RUNNER_TEMP/ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          ZIP="dist/Paper-Tree-$VERSION.zip"
          SIG_LINE="$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$KEYFILE" "$ZIP")"
          rm -f "$KEYFILE"
          echo "$SIG_LINE"
          ED_SIG="$(echo "$SIG_LINE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(stat -f%z "$ZIP")"
          if [[ -z "$ED_SIG" ]]; then echo "sign_update gave no signature" >&2; exit 1; fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Paper-Tree-$VERSION.zip"
          NOTES="release-notes/$VERSION.md"
          [[ -f "$NOTES" ]] || { echo "Paper Tree $VERSION" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          python3 scripts/make_appcast.py dist/appcast.xml "$VERSION" "$BUILD_NUMBER" "$URL" "$LENGTH" "$ED_SIG" "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: Paper-Tree-${{ env.VERSION }}
          path: |
            dist/Paper_Tree.dmg
            dist/Paper-Tree-*.zip
            dist/appcast.xml
          if-no-files-found: error

      - name: Publish release
        # Releases only ever come from main, so test branches can build without shipping.
        if: env.PUBLISH == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/$VERSION.md"
          [[ -f "$NOTES" ]] || { echo "Paper Tree for Mac $VERSION" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          gh release create "$TAG" dist/Paper_Tree.dmg "dist/Paper-Tree-$VERSION.zip" dist/appcast.xml \
            --title "Paper Tree $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA" --latest

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${SIGN_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi

      - name: Release already exists
        if: env.PUBLISH != 'true' || github.ref != 'refs/heads/main'
        run: echo "Release $TAG already exists, so this run only uploads the build as an artifact. Bump CFBundleShortVersionString to publish a new version."
